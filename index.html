<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,"Noto Sans Georgian",sans-serif;background:#f4f5f7;color:#1f2937}
header{background:#2f4b6e;color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}header span{font-size:13px;opacity:.85}

<script>
function convertSheet(XLSX, ws){
  const cell=(r,c)=>ws[XLSX.utils.encode_cell({r:r-1,c:c-1})];
  const num=x=>typeof x==='number'?x:null;
  const parse=(cl,addr)=>{
    if(!cl)return null;
    const f=cl.f?String(cl.f).replace(/\s+/g,''):null;
    if(f){let m;
      if((m=f.match(/^\(?([\d.]+)\/([\d.]+)\)?$/)))return{a:+m[1],pc:'GEL',rate:+m[2]};
      if((m=f.match(/^\(([\d.]+)\/([\d.]+)\)\+\(([\d.]+)\/([\d.]+)\)$/)))return{a:Math.round((m[1]/m[2]+m[3]/m[4])*100)/100,pc:null,rate:'',flag:'ორი გადახდის ჯამი (ფორმულა)'};
      if(/^[A-Z]+\d+$/.test(f)&&num(cl.v)!==null)return{a:cl.v,pc:null,rate:''};
      if(num(cl.v)!==null)return{a:cl.v,pc:null,rate:''};
      return{skip:1,flag:addr+': ფორმულა «='+cl.f+'», შეამოწმე'};
    }
    if(typeof cl.v==='number')return{a:cl.v,pc:null,rate:''};
    const s=String(cl.v??'').trim();let m;
    if(!s||s==='~')return{skip:1,flag:addr+': უჯრაში ჩაწერილია «'+cl.v+'»'};
    if((m=s.match(/^GEL\s*([\d,.]+)$/)))return{a:+m[1].replace(/,/g,''),pc:'GEL',rate:'',flag:addr+': ლარით, კურსი არ არის'};
    if((m=s.match(/^\$\s*([\d\s]+)$/)))return{a:+m[1].replace(/\s/g,''),pc:null,rate:'',flag:addr+': ჩაწერილია «'+s+'»'};
    return{skip:1,flag:addr+': უჯრაში ჩაწერილია «'+s+'», ხელით შეამოწმე'};
  };
  const range=XLSX.utils.decode_range(ws['!ref']);const out=[];const cur='USD';
  for(let r=3;r<=range.e.r+1;r++){
    const nm=cell(r,4);if(!nm||!String(nm.v).trim())continue;
    const val=(c)=>{const x=cell(r,c);return x&&typeof x.v==='number'?x.v:0};
    const G=val(7),H=val(8),flags=[],plan={},paid={};
    for(let c=10;c<=170;c++)for(const [dest,rr] of [[plan,r],[paid,r+1]]){
      const cl=cell(rr,c);const addr=XLSX.utils.encode_cell({r:rr-1,c:c-1});const p=parse(cl,addr);
      if(!p)continue;if(p.flag)flags.push(p.flag.startsWith(addr)?p.flag:addr+': '+p.flag);if(p.skip)continue;dest[c]=p}
    const cols=[...new Set([...Object.keys(plan),...Object.keys(paid)].map(Number))].sort((a,b)=>a-b);
    let sched=[],start='',term=0;
    if(cols.length){const c0=cols[0],c1=cols[cols.length-1],i=c0-10,y=2023+Math.floor((9+i)/12),m=(9+i)%12+1;start=y+'-'+String(m).padStart(2,'0');term=c1-c0+1;
      for(let c=c0;c<=c1;c++){const pl=plan[c]?plan[c].a:0,pd=paid[c];sched.push({plan:Math.round(pl*100)/100,paid:pd?Math.round(pd.a*100)/100:'',pc:pd?(pd.pc||cur):cur,rate:pd?pd.rate:''})}}
    const fp=cols.length&&plan[cols[0]]?plan[cols[0]].a:null;
    const inside=sched.length&&H>0&&fp!==null&&Math.abs(fp-H)<.5;const down=inside?0:H;
    const psum=sched.reduce((a,s)=>a+s.plan,0),diff=Math.round((G-down-psum)*100)/100;
    if(sched.length&&Math.abs(diff)>.5)flags.push('გრაფიკის ჯამი ნაშთს არ ემთხვევა (სხვაობა '+diff+')');
    let day=cell(r,9)&&typeof cell(r,9).v==='number'?cell(r,9).v:null;
    if(day===null){day=5;flags.push('გადახდის დღე არ იყო მითითებული, ჩაწერილია 5')}
    let B=cell(r,2)?cell(r,2).v:null;
    if(B instanceof Date){const d=new Date(B.getTime()+432e5);B=d.getDate()+'.'+(d.getMonth()+1);flags.push('ხელშეკრულების №-ის ნაცვლად თარიღი იყო ჩაწერილი')}
    const C=cell(r,3)?cell(r,3).v:null;let ph=cell(r,6)?cell(r,6).v:null;ph=ph==null?'':String(ph).trim().replace(/\s+/g,' ');
    let note='ხელშ. №'+(B!=null?B:'—')+', '+(C||'—');if(flags.length)note+=' | შესამოწმებელი: '+flags.join('; ');
    out.push({name:String(nm.v).trim(),floor:'',apt:cell(r,5)&&cell(r,5).v!=null?String(cell(r,5).v).trim():'',phone:ph,email:'',sqm:'',ppsqm:'',total:G,cur,down,term,start,day,sched,note,_flag:flags.length?1:0});
  }
  return out}

</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,onSnapshot,doc,setDoc,deleteDoc,writeBatch,getDocs} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyBNa4B-0hf_a13g3wW2ohK2xGKnOPqLbrY",authDomain:"debitorebi-baza.firebaseapp.com",projectId:"debitorebi-baza",storageBucket:"debitorebi-baza.firebasestorage.app",messagingSenderId:"269292067281",appId:"1:269292067281:web:d2330c15d3328af967a8f0"});
const auth=getAuth(app),db=getFirestore(app);
const CUR=['USD','EUR','GEL'],SY={USD:'$',EUR:'€',GEL:'₾'};
const $=s=>document.querySelector(s),r2=n=>Math.round((+n||0)*100)/100;
const fm=(n,c)=>r2(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+SY[c];
const p2=n=>String(n).padStart(2,'0'),dd=d=>`${p2(d.getDate())}.${p2(d.getMonth()+1)}.${d.getFullYear()}`;
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
// კურსი: თუ ერთ-ერთი ლარია -> ლარი 1 უცხოურ ვალუტაზე; სხვა შემთხვევაში 1 გადახდის ვალ. = ? ხელშეკრულების ვალ.
const conv=(a,p,c,r)=>{a=+a||0;r=+r||0;if(!a||p==c)return a;if(!r)return 0;return c=='GEL'?a*r:p=='GEL'?a/r:a*r};
const rl=(p,c)=>p==c?'':c=='GEL'?`1 ${p} = ? ₾`:p=='GEL'?`1 ${c} = ? ₾`:`1 ${p} = ? ${c}`;
const due=(c,i)=>{const [y,m]=(c.start||'').split('-').map(Number);if(!y)return null;const dim=new Date(y,m+i,0).getDate();return new Date(y,m-1+i,Math.min(+c.day||1,dim))};
const tot=c=>(+c.sqm&&+c.ppsqm)?r2(c.sqm*c.ppsqm):r2(+c.total||0);
function calc(c){const s=c.sched||[],T=today(),total=tot(c),down=+c.down||0;let paid=0,req=down,cum=down;const cp=[],rows=[];
 s.forEach((x,i)=>{const p=conv(x.paid,x.pc,c.cur,x.rate),d=due(c,i),late=d&&d<=T,pl=+x.plan||0;paid+=p;cum+=pl;cp.push(cum);if(late)req+=pl;
  const pdt=x.pdate?new Date(x.pdate+'T00:00:00'):null,dl=pdt&&d&&pdt>d?Math.round((pdt-d)/864e5):0;let st,tx;
  if(pl<=.005&&p<=0){st='wait';tx=''}
  else if(p>=pl-.005){st=dl?'lt':'ok';tx=dl?`გადაიხადა ${dl} დღით გვიან`:(pdt?'გადახდილია დროულად':'გადახდილია')}
  else if(p>0){st='part';tx=`დააკლო ${fm(pl-p,c.cur)}`+(dl?`, გადაიხადა ${dl} დღით გვიან`:'')+(late?' · ვადა გასულია':'')}
  else if(late){st='late';tx=`ვადაგადაცილებულია ${Math.round((T-d)/864e5)} დღით`}
  else{st='wait';tx='ჯერ არ დამდგარა'}
  rows.push({p,d,st,tx})});
 const rec=down+paid,ov=Math.max(0,r2(req-rec));let days=0;
 if(ov>0){const k=cp.findIndex((v,i)=>v>rec+.005&&rows[i].d&&rows[i].d<=T);if(k>=0)days=Math.round((T-rows[k].d)/864e5)}
 return{total,down,rec,rem:r2(total-rec),ov,days,rows,sum:r2(s.reduce((a,y)=>a+(+y.plan||0),0))}}
let cur=null,clients=[],unsub=null,admin=false,seeTot=false,uunsub=null,UL=[];
const go=v=>{['login','list','detail','users'].forEach(x=>$('#'+x).classList.toggle('hidden',x!=v))};
function renderList(){
 const S={};clients.forEach(c=>{const k=calc(c),s=S[c.cur]??={rec:0,rem:0,ov:0,n:0,late:0};s.rec+=k.rec;s.rem+=k.rem;s.ov+=k.ov;s.n++;if(k.ov>0)s.late++});
 const FULL=admin||seeTot;$('#sums').innerHTML=(clients.length?`<div class="card"><h3>სულ</h3><div class="k"><span>კლიენტების რაოდენობა</span><b>${clients.length}</b></div><div class="k"><span>მოვალე კლიენტი (ვადაგადაცილებული)</span><b class="red">${Object.values(S).reduce((a,x)=>a+x.late,0)}</b></div></div>`:'')+(FULL?CUR.filter(c=>S[c]).map(c=>`<div class="card"><h3>${c} · ${S[c].n} კლიენტი</h3><div class="k"><span>სულ მიღებული</span><b class="grn">${fm(S[c].rec,c)}</b></div><div class="k"><span>სულ მისაღები (დარჩენილი)</span><b>${fm(S[c].rem,c)}</b></div><div class="k"><span>ვადაგადაცილებული</span><b class="red">${fm(S[c].ov,c)}</b></div><div class="k"><span>მოვალე კლიენტი</span><b>${S[c].late}</b></div></div>`).join(''):'')||'<p class="mu">ჯერ კლიენტი არ არის</p>';
 const q=$('#q').value.toLowerCase();
 $('#tb').innerHTML=clients.filter(c=>[c.name,c.apt,c.phone].join(' ').toLowerCase().includes(q)).sort((a,b)=>(a.name||'').localeCompare(b.name||'','ka')).map(c=>{const k=calc(c);
  const st=k.ov>0?`<span class="red">● დაგვიანება${k.days?' '+k.days+' დღე':''} · ${fm(k.ov,c.cur)}</span>`:(k.total>0&&k.rem<=.005?'<span class="grn">გადახდილია</span>':'<span class="grn">რიგზეა</span>');
  return`<tr class="c" data-id="${c.id}"><td>${c.name||''}</td><td>${c.floor||''}</td><td>${c.apt||''}</td><td>${st}</td><td>${fm(k.rem,c.cur)}</td></tr>`}).join('')}
function applyRole(){document.querySelectorAll('.adm').forEach(e=>e.classList.toggle('hidden',!admin));renderList()}
function usersView(){go('users');const me=(auth.currentUser?.email||'').toLowerCase(),L=UL.filter(u=>u.id!=me);
 $('#users').innerHTML=`<div class="bar"><button class="g" id="ub">← სიაში</button></div><div class="card wrap"><h3>მომხმარებლები</h3><table><thead><tr><th>ელფოსტა</th><th>ჯამური თანხების ხილვა</th></tr></thead><tbody>${L.map(u=>`<tr><td>${u.id}</td><td><input type="checkbox" data-u="${u.id}" ${u.canSeeTotals?'checked':''} style="width:auto"></td></tr>`).join('')||'<tr><td colspan="2" class="mu">ჯერ არავის უშესია</td></tr>'}</tbody></table><p class="mu">ახალი მომხმარებელი სიაში პირველი შესვლის შემდეგ გამოჩნდება. შენ (ადმინი) ყოველთვის ხედავ ყველაფერს.</p></div>`}
function open(c){cur=c?structuredClone(c):{name:'',floor:'',apt:'',phone:'',email:'',sqm:'',ppsqm:'',cur:'USD',down:'',term:24,start:new Date().toISOString().slice(0,7),day:5,sched:[]};cur.sched=cur.sched||[];detail()}
const rowsHtml=()=>cur.sched.map((x,i)=>`<tr data-i="${i}"><td>${i+1}</td><td class="dt"></td><td><input type="number" step="any" data-s="plan" value="${x.plan}" ${i==cur.sched.length-1&&i>0?'disabled':''}></td><td><input type="number" step="any" data-s="paid" value="${x.paid}"></td><td><input type="date" data-s="pdate" value="${x.pdate||''}"></td><td><select data-s="pc">${CUR.map(c=>`<option ${c==x.pc?'selected':''}>${c}</option>`).join('')}</select></td><td><input type="number" step="any" data-s="rate" value="${x.rate}" class="rt"></td><td class="cv"></td><td class="sx"></td></tr>`).join('');
function detail(){go('detail');
 const f=(k,l,t='text')=>`<div><label>${l}</label><input data-k="${k}" type="${t}" ${t=='number'?'step="any"':''} value="${cur[k]??''}"></div>`;
 $('#detail').innerHTML=`<div class="bar"><button class="g" id="back">← სიაში</button><button id="save">შენახვა</button>${cur.id?'<button class="d" id="del">წაშლა</button>':''}</div>
<div class="card"><div class="grid">${f('name','სახელი გვარი')}${f('floor','სართული')}${f('apt','ბინის ნომერი')}${f('phone','ტელეფონი','tel')}${f('email','ელფოსტა','email')}${f('sqm','კვმ','number')}${f('ppsqm','ფასი 1 კვმ-ზე','number')}<div><label>ხელშეკრულების ვალუტა</label><select data-k="cur">${CUR.map(c=>`<option ${c==cur.cur?'selected':''}>${c}</option>`).join('')}</select></div>${f('down','პირველადი შენატანი (თანხა)','number')}${f('dpct','ან პირველადი შენატანი (%)','number')}${f('term','ვადა (თვე)','number')}${f('start','პირველი გადახდის თვე','month')}${f('day','გადახდის დღე (1-31)','number')}${f('note','შენიშვნა')}</div>
<p><button class="g" id="gen">გრაფიკის გენერირება</button> <span class="mu">ჯამური ღირებულება: <b id="tot"></b></span></p></div>

<div class="card wrap"><table><thead><tr><th>#</th><th>თარიღი</th><th>გეგმა</th><th>გადახდილი</th><th>გადახდის თარიღი</th><th>ვალუტა</th><th>კურსი (ეროვნული ბანკი)</th><th>ხელშ. ვალუტაში</th><th>სტატუსი</th></tr></thead><tbody id="rows">${rowsHtml()}</tbody></table></div>
<p class="red" id="rmsg"></p><p class="mu">პირველი თვის გეგმაში თანხის ჩაწერისას ყველა შუა თვე იგივე თანხით შეივსება, ბოლო თვე კი დანაკლისს ავტომატურად გადაითვლის.</p><p class="mu">მწვანე: დროულად გადახდილი · ნარინჯისფერი: გვიან გადაიხადა · ყვითელი: თანხა დააკლო · წითელი: ვადაგადაცილებული · ნაცრისფერი: ჯერ არ დამდგარა</p><p class="mu">${cur.updatedBy?`ბოლოს შეცვალა: ${cur.updatedBy}, ${dd(new Date(cur.updatedAt))} ${p2(new Date(cur.updatedAt).getHours())}:${p2(new Date(cur.updatedAt).getMinutes())}`:''}</p>`;upd()}
function upd(){const k=calc(cur),c=cur.cur;$('#tot').textContent=fm(k.total,c);
 $('#sum').innerHTML=`<div class="grid"><div><label>პირველადი შენატანი</label>${fm(k.down,c)}</div><div><label>სულ მიღებული</label><b class="grn">${fm(k.rec,c)}</b></div><div><label>დარჩენილი გადასახდელი</label><b>${fm(k.rem,c)}</b></div><div><label>ვადაგადაცილებული</label><b class="${k.ov>0?'red':''}">${fm(k.ov,c)}${k.days?` (${k.days} დღე)`:''}</b></div></div>${cur.sched.length&&Math.abs(k.sum-(k.total-k.down))>.01?`<p class="red">გრაფიკის ჯამი (${fm(k.sum,c)}) არ ემთხვევა ნაშთს (${fm(k.total-k.down,c)}). დააჭირე „გრაფიკის გენერირებას“.</p>`:''}${cur.sched.length>1&&cur.sched[cur.sched.length-1].plan<-.005?'<p class="red">ბოლო თვის გადახდა უარყოფითია: თვიური თანხა ზედმეტად დიდია.</p>':''}`;
 document.querySelectorAll('#rows tr').forEach((tr,i)=>{const x=cur.sched[i],r=k.rows[i],rt=tr.querySelector('.rt');tr.className=r.st;tr.querySelector('.sx').textContent=r.tx;tr.querySelector('.dt').textContent=r.d?dd(r.d):'—';
  const pi=tr.querySelector('[data-s=plan]');if(document.activeElement!==pi)pi.value=x.plan;
  rt.placeholder=rl(x.pc,c);rt.disabled=x.pc==c;if(document.activeElement!==rt)rt.value=x.rate??'';tr.querySelector('.cv').textContent=x.paid!==''?fm(r.p,c):''})}
const RC={},r4=n=>Math.round(n*1e4)/1e4;
const nbg=(code,d)=>RC[code+d]??=fetch(`https://nbg.gov.ge/gw/api/ct/monetarypolicy/currencies/en/json/?currencies=${code}&date=${d}`).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{const c=j[0].currencies[0];return c.rate/(c.quantity||1)});
async function autoRate(i){const S=cur.sched,x=S[i],c=cur.cur,m=document.getElementById('rmsg');
 if(x.pc==c){x.rate='';upd();return}
 if(!x.pdate||x.pdate>new Date().toISOString().slice(0,10))return;
 try{const g=code=>code=='GEL'?Promise.resolve(1):nbg(code,x.pdate);const [a,b]=await Promise.all([g(x.pc),g(c)]);
  if(!cur||cur.sched!==S||S[i]!==x)return;
  x.rate=r4(x.pc=='GEL'?b:c=='GEL'?a:a/b);if(m)m.textContent='';upd()}
 catch(e){delete RC[x.pc+x.pdate];delete RC[c+x.pdate];if(m)m.textContent='კურსი ეროვნული ბანკიდან ვერ ჩაიტვირთა, ჩაწერე ხელით.'}}
function gen(){const n=Math.max(1,Math.round(+cur.term)||0),t=r2(tot(cur)-(+cur.down||0)),b=Math.floor(t/n*100)/100,o=cur.sched;
 cur.sched=Array.from({length:n},(_,i)=>({plan:i<n-1?b:r2(t-b*(n-1)),paid:o[i]?.paid??'',pc:o[i]?.pc||cur.cur,rate:o[i]?.rate??'',pdate:o[i]?.pdate??''}));$('#rows').innerHTML=rowsHtml();upd()}
function fixLast(){const s=cur.sched,n=s.length;if(n>1)s[n-1].plan=r2(tot(cur)-(+cur.down||0)-s.slice(0,n-1).reduce((a,x)=>a+(+x.plan||0),0))}
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.k,s=t.dataset.s;if(!cur||$('#detail').classList.contains('hidden'))return;
 if(k){cur[k]=t.type=='number'?(t.value===''?'':+t.value):t.value;const dn=()=>document.querySelector('[data-k=down]'),dp=()=>document.querySelector('[data-k=dpct]');
  if(k=='dpct'){cur.down=cur.dpct===''?'':r2(tot(cur)*cur.dpct/100);dn().value=cur.down}
  else if(k=='down'){cur.dpct='';dp().value=''}
  else if(['sqm','ppsqm'].includes(k)&&cur.dpct!==''&&cur.dpct!=null){cur.down=r2(tot(cur)*cur.dpct/100);dn().value=cur.down}
  if(['sqm','ppsqm','down','dpct'].includes(k))fixLast();upd()}
 else if(s){const i=+t.closest('tr').dataset.i;cur.sched[i][s]=(s=='pc'||s=='pdate')?t.value:(t.value===''?'':+t.value);if(s=='plan'){if(i==0&&cur.sched.length>2){const v=+cur.sched[0].plan||0;for(let j=1;j<cur.sched.length-1;j++)cur.sched[j].plan=v}fixLast()}upd();if(s=='pdate'||s=='pc'||(s=='paid'&&cur.sched[i].rate===''))autoRate(i)}});
document.addEventListener('click',async e=>{const t=e.target,id=t.id,tr=t.closest('tr.c');
 if(id=='mn')$('#mm').classList.toggle('hidden');else $('#mm').classList.add('hidden');
 if(id=='imp'&&admin)$('#fi').click();
 else if(id=='usr'&&admin)usersView();else if(id=='ub')go('list');
 else if(id=='clr'&&admin){if(!clients.length){alert('ბაზა უკვე ცარიელია');return}
  if(!confirm(`ყველა ${clients.length} კლიენტი სამუდამოდ წაიშლება. გავაგრძელო?`))return;
  if(prompt('დასადასტურებლად ჩაწერე სიტყვა: წაშლა')!=='წაშლა'){alert('გაუქმდა, არაფერი წაშლილა');return}
  try{const L=[...clients];for(let i=0;i<L.length;i+=400){const b=writeBatch(db);L.slice(i,i+400).forEach(c=>b.delete(doc(db,'clients',c.id)));await b.commit()}alert('ბაზა გასუფთავდა')}catch(x){alert('შეცდომა: '+x.message)}}
 else if(tr){open(clients.find(c=>c.id==tr.dataset.id))}
 else if(id=='new')open();else if(id=='back'){cur=null;go('list')}else if(id=='gen')gen();else if(id=='out')signOut(auth);
 else if(id=='save'){if(!(cur.name||'').trim()){alert('ჩაწერე სახელი გვარი');return}
  const cid=cur.id||doc(collection(db,'clients')).id,{id:_,...d}=cur;
  try{await setDoc(doc(db,'clients',cid),{...d,total:tot(cur),updatedBy:auth.currentUser.email,updatedAt:Date.now()});cur=null;go('list')}catch(x){alert('ვერ შეინახა: '+x.message)}}
 else if(id=='del'&&confirm('ნამდვილად წავშალო ეს კლიენტი?')){try{await deleteDoc(doc(db,'clients',cur.id));cur=null;go('list')}catch(x){alert('ვერ წაიშალა: '+x.message)}}
 else if(id=='exp'){const A=[],B=[];clients.forEach(c=>{const k=calc(c);A.push({'სახელი გვარი':c.name,'სართული':c.floor,'ბინა':c.apt,'ტელეფონი':c.phone,'ელფოსტა':c.email,'კვმ':c.sqm,'ფასი კვმ':c.ppsqm,'ვალუტა':c.cur,'ჯამი':k.total,'პირველადი შენატანი':k.down,'სულ მიღებული':k.rec,'დარჩენილი':k.rem,'ვადაგადაცილებული':k.ov,'გადახდის დღე':c.day});
  (c.sched||[]).forEach((x,i)=>B.push({'სახელი გვარი':c.name,'ბინა':c.apt,'თარიღი':k.rows[i].d?dd(k.rows[i].d):'','გეგმა':x.plan,'გადახდილი':x.paid,'გადახდის თარიღი':x.pdate||'','სტატუსი':k.rows[i].tx,'გადახდის ვალუტა':x.pc,'კურსი':x.rate,'ხელშ. ვალუტაში':r2(k.rows[i].p)}))});
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(A),'კლიენტები');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(B),'გრაფიკები');XLSX.writeFile(wb,'debitorebi_'+new Date().toISOString().slice(0,10)+'.xlsx')}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.u)setDoc(doc(db,'users',t.dataset.u),{email:t.dataset.u,canSeeTotals:t.checked},{merge:true}).catch(x=>{alert('ვერ შეინახა: '+x.message);t.checked=!t.checked})});
$('#q').oninput=renderList;
$('#fi').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true}),arr=convertSheet(XLSX,wb.Sheets[wb.SheetNames[0]]);
  if(!arr.length){alert('ფაილში კლიენტები ვერ ვიპოვე');return}
  if(!confirm(`ნაპოვნია ${arr.length} კლიენტი (${arr.filter(c=>c._flag).length}-ს აქვს შენიშვნა შესამოწმებელი).`+(clients.length?`\n\nბაზაში უკვე ${clients.length} კლიენტია, დუბლიკატები გაჩნდება! ჯერ გაასუფთავე ბაზა.`:'')+'\n\nჩავტვირთო?'))return;
  for(let i=0;i<arr.length;i+=400){const b=writeBatch(db);arr.slice(i,i+400).forEach(c=>{const {_flag,...d}=c;b.set(doc(collection(db,'clients')),{...d,updatedBy:auth.currentUser.email,updatedAt:Date.now()})});await b.commit()}
  alert('ჩაიტვირთა '+arr.length+' კლიენტი')}catch(x){alert('შეცდომა: '+x.message)}};
$('#lf').onsubmit=async e=>{e.preventDefault();$('#err').textContent='';try{await signInWithEmailAndPassword(auth,$('#em').value.trim(),$('#pw').value)}catch(x){$('#err').textContent='არასწორი ელფოსტა ან პაროლი'}};
onAuthStateChanged(auth,u=>{unsub&&unsub();unsub=null;uunsub&&uunsub();uunsub=null;admin=false;seeTot=false;UL=[];if(!u){$('#me').textContent='';cur=null;applyRole();return go('login')}
 $('#me').textContent=u.email;go('list');applyRole();
 const em=u.email.toLowerCase();
 getDocs(collection(db,'users')).then(()=>{admin=true;applyRole();uunsub=onSnapshot(collection(db,'users'),s=>{UL=s.docs.map(d=>({...d.data(),id:d.id}));if(!$('#users').classList.contains('hidden'))usersView()})})
  .catch(()=>{uunsub=onSnapshot(doc(db,'users',em),s=>{if(!s.exists()){setDoc(doc(db,'users',em),{email:em,canSeeTotals:false}).catch(()=>{});return}seeTot=s.data().canSeeTotals===true;applyRole()},()=>{})});
 unsub=onSnapshot(collection(db,'clients'),s=>{clients=s.docs.map(d=>({...d.data(),id:d.id}));renderList()},x=>alert('ბაზასთან წვდომის შეცდომა: '+x.message))});
</script></body></html>
